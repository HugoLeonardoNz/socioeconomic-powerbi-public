name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O .pbix e' binario: o CI nao consegue abrir o modelo nem avaliar DAX. O que
# ele cobre e' a base sobre a qual o modelo roda (data/processed) e a coerencia
# do que o repositorio declara sobre si — badge, cabecalho do measures.md e as
# medidas que o documento de fato nomeia. Foi assim que apareceu um numero no
# README que nao saia deste dado.
jobs:
  publicado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Testes dos numeros publicados
        run: pytest tests/ -v
